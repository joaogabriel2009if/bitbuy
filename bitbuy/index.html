<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitBuy — Marketplace Escolar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="auth">

<div class="auth-page">
  <!-- Blobs animados de fundo -->
  <div class="auth-blob auth-blob-1"></div>
  <div class="auth-blob auth-blob-2"></div>

  <div class="auth-container">

    <!-- Branding (apenas desktop) -->
    <div class="auth-branding">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
        </div>
        <div class="auth-logo-text">
          <h1 class="gradient-text">BitBuy</h1>
          <p>Marketplace Escolar</p>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:.75rem">
        <div class="auth-feature">
          <div class="auth-feature-icon" style="background:var(--secondary)">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </div>
          <div>
            <h3>Compre e Venda com Segurança</h3>
            <p>Conecte-se com colegas da sua escola</p>
          </div>
        </div>
        <div class="auth-feature">
          <div class="auth-feature-icon" style="background:#A6EBE2">
            <svg viewBox="0 0 24 24" fill="none" stroke="#180A6C" stroke-width="2">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg>
          </div>
          <div>
            <h3>Anúncios Fáceis</h3>
            <p>Crie e gerencie seus produtos rapidamente</p>
          </div>
        </div>
        <div class="auth-feature">
          <div class="auth-feature-icon" style="background:var(--accent)">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div>
            <h3>Comunidade Ativa</h3>
            <p>Avaliações e reputação verificada</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Card de autenticação -->
    <div class="auth-card-wrapper">
      <div class="auth-card">

        <!-- Logo mobile -->
        <div class="auth-mobile-logo">
          <div class="auth-logo-icon" style="padding:.75rem">
            <svg style="width:2.5rem;height:2.5rem" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
          </div>
        </div>

        <div class="auth-card-header">
          <h2 class="hidden-lg">BitBuy</h2>
          <h2 class="show-lg" style="display:none">Bem-vindo de volta!</h2>
          <p>Entre ou crie sua conta</p>
        </div>

        <!-- Tabs -->
        <div id="auth-tabs">
          <div class="tabs-list" style="margin-bottom:1.5rem">
            <button class="tab-trigger active" data-tab="login">Login</button>
            <button class="tab-trigger" data-tab="register">Cadastro</button>
          </div>

          <!-- Login -->
          <div class="tab-content active" data-tab="login">
            <form id="login-form" onsubmit="handleLogin(event)">
              <div class="form-group">
                <label class="label" for="login-email">E-mail ou Usuário</label>
                <input class="input" id="login-email" type="text" placeholder="seu@email.com ou usuario" required>
              </div>
              <div class="form-group">
                <label class="label" for="login-password">Senha</label>
                <input class="input" id="login-password" type="password" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-primary btn-full" id="login-btn">Entrar</button>
            </form>
          </div>

          <!-- Cadastro -->
          <div class="tab-content" data-tab="register">
            <form id="register-form" onsubmit="handleRegister(event)">
              <div class="form-group">
                <label class="label" for="reg-username">Nome de Usuário</label>
                <input class="input" id="reg-username" type="text" placeholder="ex: joao_silva" required>
              </div>
              <div class="form-group">
                <label class="label" for="reg-email">E-mail</label>
                <input class="input" id="reg-email" type="email" placeholder="seu@email.com" required>
              </div>
              <div class="form-group">
                <label class="label" for="reg-password">Senha</label>
                <input class="input" id="reg-password" type="password" placeholder="Mínimo 6 caracteres" required>
              </div>
              <div class="form-group">
                <label class="label" for="reg-school">Instituição de Ensino</label>
                <input class="input" id="reg-school" type="text" placeholder="Nome da sua faculdade/escola" required>
              </div>
              <div class="form-group">
                <label class="label" for="reg-type">Tipo de Conta</label>
                <select class="select" id="reg-type" onchange="toggleContactField()">
                  <option value="comprador">Quero Apenas Comprar</option>
                  <option value="vendedor">Quero Vender Produtos/Serviços</option>
                </select>
              </div>
              <div class="form-group" id="contact-field" style="display:none">
                <label class="label" for="reg-contact">Telefone ou Forma de Contato</label>
                <input class="input" id="reg-contact" type="text" placeholder="Digite seu telefone ou forma de contato">
              </div>
              <button type="submit" class="btn btn-primary btn-full" id="register-btn">Cadastrar</button>
            </form>
          </div>
        </div><!-- /tabs -->

      </div>
    </div><!-- /auth-card-wrapper -->

  </div><!-- /auth-container -->
</div><!-- /auth-page -->

<div id="toast-container"></div>

<script src="app.js"></script>
<script>
  function toggleContactField() {
    const type = document.getElementById('reg-type').value;
    const field = document.getElementById('contact-field');
    const input = document.getElementById('reg-contact');
    field.style.display = type === 'vendedor' ? '' : 'none';
    input.required = type === 'vendedor';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    try {
      const data = await apiPost('login.php', {
        emailOrUsername: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      });
      if (data.success) {
        State.setUser(data.user);
        toast('Login realizado com sucesso!');
        setTimeout(() => navigate('home.html'), 600);
      } else {
        toast(data.message || 'Email/usuário ou senha incorretos.', 'error');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    } catch {
      toast('Não foi possível conectar ao servidor.', 'error');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const type = document.getElementById('reg-type').value;
    const contact = document.getElementById('reg-contact').value.trim();
    if (type === 'vendedor' && !contact) {
      toast('Informe uma forma de contato para conta de vendedor.', 'error');
      return;
    }
    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.textContent = 'Cadastrando...';
    try {
      const data = await apiPost('register.php', {
        username:    document.getElementById('reg-username').value,
        email:       document.getElementById('reg-email').value,
        password:    document.getElementById('reg-password').value,
        school:      document.getElementById('reg-school').value,
        accountType: type,
        contact,
      });
      if (data.success) {
        State.setUser(data.user);
        toast('Conta criada com sucesso!');
        setTimeout(() => navigate('home.html'), 600);
      } else {
        toast(data.message || 'Erro ao criar conta.', 'error');
        btn.disabled = false;
        btn.textContent = 'Cadastrar';
      }
    } catch {
      toast('Não foi possível conectar ao servidor.', 'error');
      btn.disabled = false;
      btn.textContent = 'Cadastrar';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTabs('auth-tabs');
    // mostrar título correto em desktop
    const isDesktop = window.innerWidth >= 1024;
    document.querySelector('.hidden-lg').style.display = isDesktop ? 'none' : '';
    document.querySelector('.show-lg').style.display  = isDesktop ? ''     : 'none';
  });
</script>
</body>
</html>
